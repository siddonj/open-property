name = "open-property"
main = "src/server/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "open-property-db"
database_id = "local"

# Phase 5 documents. Private: files are only served through /api/documents/:id/file.
[[r2_buckets]]
binding = "DOCS"
bucket_name = "open-property-docs"

# The built SPA (pnpm build → dist). /api/* always reaches the Worker; any other path that isn't a
# file falls back to index.html so the client router handles it.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
